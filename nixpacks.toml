# Railway / Nixpacks build config for apps/api (Fastify + BullMQ worker)
# Web (Next.js) deploys separately to Vercel — see DEPLOY.md
#
# This file applies when Railway's service rootDirectory is the repo root.
# If Railway sets rootDirectory to apps/api, the workspace's package.json
# scripts (which include `prisma generate` in build and `prisma migrate deploy`
# in start) handle the same steps.

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build:api"]

[start]
cmd = "npm run start:api"
